# Local development infrastructure. Start with `pnpm infra:up`. A .env is optional: every variable
# below has a development default (see .env.example for the list).
# Services: ClickHouse (the database) and Grafana (the dashboards, http://127.0.0.1:3001).
# Browser containers (chromium, headless-shell, lightpanda) are started by the fleet runner, not here.
name: fleetscope

services:
  clickhouse:
    # 26.8 is an LTS branch (the GitHub release tags end in "-lts"). Pinned to an exact patch so
    # local dev and CI run the same server. Keep this tag in sync with .github/workflows/ci.yml.
    image: clickhouse/clickhouse-server:26.8.34.13
    restart: unless-stopped
    ports:
      # Bound to loopback only: the dev database should not be reachable from the LAN.
      - "127.0.0.1:8123:8123" # HTTP interface (what @clickhouse/client uses)
      - "127.0.0.1:9000:9000" # native protocol (clickhouse-client)
    environment:
      # Setting a user/password also enables network access. Without one, the image only
      # allows the passwordless `default` user from localhost inside the container.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-fleetscope}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-fleetscope_dev_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-fleetscope}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    # A real limit, so ClickHouse reports it (system.asynchronous_metric_log: CGroupMemoryTotal and
    # CGroupMaxCPU) and the Capacity dashboard shows utilisation against a limit instead of "not
    # available". Without these the container sees the whole Docker Desktop VM and both are NULL.
    # 4 GiB and 2 cores are enough for the dev data and the tests and leave the laptop usable. To
    # change them, edit here; ClickHouse sizes its memory limit from the cgroup.
    mem_limit: 4g
    cpus: 2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # system.part_log and system.asynchronous_metric_log for the Capacity dashboard, with a 14 day
      # retention (see the file). Relative to the repository root, like the Grafana mounts below.
      - ./infra/clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  grafana:
    # Grafana OSS. The image is `grafana/grafana`: the older `grafana/grafana-oss` repository stopped
    # at 13.0.2 (June 2026) and no longer gets releases. Pinned to an exact patch version, like
    # ClickHouse above. 13.2.4 is the current stable release; the ClickHouse plugin below needs
    # Grafana 11.6 or newer.
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      # Loopback only. 3001, not Grafana's usual 3000, because 3000 is often taken on a dev machine.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      # Two data source plugins from Grafana Labs, both pinned (comma separated): ClickHouse, and
      # Infinity (JSON from the ClickHouse Cloud billing API, for the Capacity dashboard). _SYNC makes
      # Grafana install them before it starts (the plain GF_PLUGINS_PREINSTALL installs in the
      # background), so a provisioned data source never meets a plugin that is not there yet.
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.2,yesoreyeram-infinity-datasource@4.1.3
      # Grafana reads its provisioning from a copy made at start (see the entrypoint below).
      GF_PATHS_PROVISIONING: /tmp/provisioning
      # ClickHouse Cloud API key and organisation id for the billing data source. Any unset (the default): no billing
      # data source locally. See infra/grafana/README.md, "Billing".
      CLICKHOUSE_CLOUD_KEY_ID: ${CLICKHOUSE_CLOUD_KEY_ID:-}
      CLICKHOUSE_CLOUD_KEY_SECRET: ${CLICKHOUSE_CLOUD_KEY_SECRET:-}
      CLICKHOUSE_CLOUD_ORG_ID: ${CLICKHOUSE_CLOUD_ORG_ID:-}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-fleetscope_dev_admin}
      # Anyone who can reach 127.0.0.1:3001 can look at the dashboards without logging in,
      # but only as a Viewer. Editing needs the admin login above.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # No phone-home: no usage statistics, no update checks, no news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Dark is the only theme the dashboards are designed for (design/DESIGN.md section 2): their
      # colours are fixed hex values. 13.2.4 already defaults to dark; this keeps it explicit.
      GF_USERS_DEFAULT_THEME: dark
      # Grafana's SQLite database. WAL mode (write-ahead log) skips a disk sync after every one of the
      # ~800 first-start schema migrations: 7 minutes without it on a slow Docker disk. Dev only.
      GF_DATABASE_WAL: "true"
      # Read by the provisioning files in infra/grafana/provisioning (Grafana expands $NAME there).
      # Grafana only gets the read-only user. It never sees the admin ClickHouse user.
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-fleetscope}
      CLICKHOUSE_GRAFANA_USER: ${CLICKHOUSE_GRAFANA_USER:-grafana_ro}
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:-grafana_ro_dev_password}
    # Provisioning cannot be conditional, so the entrypoint copies the base files and adds the billing
    # data source only when both API key variables are set. Then it runs the image's own entrypoint.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /tmp/provisioning && cp -r /provisioning/base/. /tmp/provisioning/ &&
        if [ -n "$$CLICKHOUSE_CLOUD_KEY_ID" ] && [ -n "$$CLICKHOUSE_CLOUD_KEY_SECRET" ] && [ -n "$$CLICKHOUSE_CLOUD_ORG_ID" ]; then
        cp /provisioning/optional/clickhouse-cloud-api.yaml /tmp/provisioning/datasources/;
        echo "fleetscope: billing data source clickhouse-cloud-api provisioned";
        else echo "fleetscope: no CLICKHOUSE_CLOUD_KEY_ID/SECRET/ORG_ID, billing data source not provisioned"; fi;
        exec /run.sh
    volumes:
      # Grafana's own database and the installed plugin.
      - grafana_data:/var/lib/grafana
      # Paths are relative to the repository root (pnpm infra:up passes --project-directory .).
      - ./infra/grafana/provisioning:/provisioning/base:ro
      - ./infra/grafana/optional-provisioning:/provisioning/optional:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and Grafana listens on IPv4 only.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      # The first start downloads the plugin from grafana.com before Grafana comes up.
      start_period: 60s

volumes:
  clickhouse_data:
  grafana_data:
