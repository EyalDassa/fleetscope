# Loads every dashboard JSON from infra/grafana/dashboards (mounted read-only at
# /var/lib/grafana/dashboards) into the "Fleetscope" folder.
# Docs checked: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
apiVersion: 1

providers:
  - name: fleetscope
    orgId: 1
    type: file
    folder: Fleetscope
    # Fixed UID: dashboards and `pnpm grafana:push` both refer to this folder.
    folderUid: fleetscope
    disableDeletion: false
    # Re-read the folder every 10 seconds, so a file change shows up without a restart.
    updateIntervalSeconds: 10
    # Lets you edit a dashboard in the UI and export the JSON back into the repo.
    # A UI save lives only in Grafana's own database; the repo file stays the source of truth
    # and overwrites the UI copy the next time the file changes.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
