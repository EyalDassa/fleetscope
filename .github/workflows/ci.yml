name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names below are what branch protection refers to. Do not rename them casually.
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # esbuild bundles of the api and the demo site
      - name: ClickHouse image tag in CI matches docker-compose
        run: bash .github/scripts/check-clickhouse-tag.sh
      - name: Playwright client and browser image versions match
        run: bash .github/scripts/check-playwright-version.sh --strict
      - name: Upstream browser images and the forwarder sidecar are pinned consistently
        run: bash .github/scripts/check-browser-images.sh --strict
      - name: The fleet smoke assertions decide as intended (no ClickHouse, no Docker)
        run: bash .github/scripts/test-assert-fleet-smoke.sh
      - name: Shell scripts are executable in git (a Windows commit drops the bit)
        run: bash .github/scripts/check-executable-bits.sh

  integration:
    name: Integration tests (ClickHouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        # Keep the tag and env in sync with infra/docker-compose.yml.
        image: clickhouse/clickhouse-server:26.8.34.13
        env:
          CLICKHOUSE_USER: fleetscope
          CLICKHOUSE_PASSWORD: fleetscope_dev_password
          CLICKHOUSE_DB: fleetscope
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s
    env:
      # Same values as .env.example. These are throwaway credentials for the CI container only.
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: fleetscope
      CLICKHOUSE_PASSWORD: fleetscope_dev_password
      CLICKHOUSE_DATABASE: fleetscope
      # The read-only user the dashboards run as (created below, like on a real deployment).
      CLICKHOUSE_GRAFANA_USER: grafana_ro
      CLICKHOUSE_GRAFANA_PASSWORD: grafana_ro_dev_password
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate
      - run: pnpm test:integration

      # Dashboards are code: every query in infra/grafana/dashboards/*.json must run against the
      # real schema, as the read-only Grafana user, with the ClickHouse plugin's macros expanded.
      # No Grafana is started; the check expands the macros itself (infra/grafana/README.md).
      - name: Create the read-only Grafana user
        run: pnpm db:grafana-user
      - name: Seed the database
        run: pnpm db:seed
      - name: Dashboards - structure, design rules, and every SQL query against ClickHouse
        run: pnpm grafana:check

  # End-to-end check of the pipeline: real browser containers (Chromium, chrome-headless-shell,
  # Lightpanda) plus their forwarder sidecars -> collector -> API -> ClickHouse.
  # No LLM calls. From outside the repo it needs the Playwright base image from MCR, node:22-alpine,
  # and the two upstream browser images from Docker Hub.
  fleet-smoke:
    name: Fleet smoke (all engines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      clickhouse:
        # Keep the tag and env in sync with infra/docker-compose.yml.
        image: clickhouse/clickhouse-server:26.8.34.13
        env:
          CLICKHOUSE_USER: fleetscope
          CLICKHOUSE_PASSWORD: fleetscope_dev_password
          CLICKHOUSE_DB: fleetscope
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 10s
    env:
      # Same values as .env.example. These are throwaway credentials for the CI container only.
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: fleetscope
      CLICKHOUSE_PASSWORD: fleetscope_dev_password
      CLICKHOUSE_DATABASE: fleetscope
      LOG_LEVEL: info
      API_PORT: "4000"
      API_HOST: 127.0.0.1
      FLEETSCOPE_API_URL: http://localhost:4000
      DEMO_SITE_URL: http://localhost:3100
      DEMO_SITE_PORT: "3100"
      # The browser containers reach the demo site through host.docker.internal, which on Linux is
      # the Docker bridge address, so it must listen on all interfaces, not just loopback.
      DEMO_SITE_HOST: 0.0.0.0
      # Image tags. The Chromium tag must equal the one built below and the Playwright version pinned
      # in the runner and collector (checked by check-playwright-version.sh); the other three are
      # checked by check-browser-images.sh. Both run in the "check" job.
      FLEET_BROWSER_IMAGE_CHROMIUM: fleetscope/playwright-chromium:1.64.1-2
      FLEET_BROWSER_IMAGE_CHROME_HEADLESS_SHELL: chromedp/headless-shell:156.0.8078.48@sha256:3da74b0945e4f80f00f0310bcda9f76cee283539ebd200a053a7bebf3de89423
      FLEET_BROWSER_IMAGE_LIGHTPANDA: lightpanda/browser:1.0.2@sha256:5d1d724c476957d8c2f8393a51fd089477523b0e5aa9c783c48688785d934fb9
      FLEET_FORWARDER_IMAGE: fleetscope/forwarder:1-1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The GitHub Actions layer cache needs the docker-container driver, which buildx sets up.
      # Both Docker actions are pinned to a commit SHA because they get the Actions cache token.
      # Dependabot's github-actions ecosystem keeps the pins updated.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Chromium browser image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/browsers
          file: infra/browsers/chromium/Dockerfile
          load: true # put the image into the local Docker daemon, where the fleet runner finds it
          push: false
          tags: fleetscope/playwright-chromium:1.64.1-2
          # A cache problem (rate limit, outage) must never fail the build, so ignore-error.
          cache-from: type=gha,scope=browser-chromium
          cache-to: type=gha,mode=max,scope=browser-chromium,ignore-error=true
          provenance: false # attestations cannot be loaded into the local daemon
          sbom: false
      - name: Build the forwarder sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/browsers
          file: infra/browsers/forwarder/Dockerfile
          load: true
          push: false
          tags: fleetscope/forwarder:1-1
          cache-from: type=gha,scope=browser-forwarder
          cache-to: type=gha,mode=max,scope=browser-forwarder,ignore-error=true
          provenance: false
          sbom: false
      # The upstream images are used unmodified, so there is nothing to build and no layer cache to
      # keep (together about 220 MB to download). Docker Hub can answer 429/5xx now and then, so retry.
      - name: Pull the upstream browser images
        run: |
          for image in "$FLEET_BROWSER_IMAGE_CHROME_HEADLESS_SHELL" "$FLEET_BROWSER_IMAGE_LIGHTPANDA"; do
            for attempt in 1 2 3; do
              docker pull "$image" && continue 2
              echo "docker pull $image failed (attempt $attempt), retrying" >&2
              sleep $((attempt * 10))
            done
            echo "could not pull $image" >&2
            exit 1
          done

      - run: pnpm db:migrate
      - name: Build the api and the demo site
        run: pnpm --filter @fleetscope/api --filter @fleetscope/demo-site build
      - name: Start the api and the demo site
        run: |
          mkdir -p smoke-logs
          nohup pnpm --filter @fleetscope/api start > smoke-logs/api.log 2>&1 &
          nohup pnpm --filter @fleetscope/demo-site start > smoke-logs/demo-site.log 2>&1 &
          bash .github/scripts/wait-for-url.sh "$FLEETSCOPE_API_URL/healthz" 60 smoke-logs/api.log
          bash .github/scripts/wait-for-url.sh "$DEMO_SITE_URL/healthz" 60 smoke-logs/demo-site.log

      # 6 sessions over 3 engines: the runner assigns scenario x engine pairs round-robin, so every
      # engine gets exactly 2 (assert-fleet-smoke.sh expects that).
      - name: Run 6 sessions on 3 engines
        timeout-minutes: 12
        run: pnpm fleet run --engines chromium,chrome-headless-shell,lightpanda --sessions 6 --concurrency 3 --seed 1
      # Per engine: sessions ended, actions, container + cdp samples, network requests, no duplicates, no
      # leaked containers (sidecars included). Lightpanda may have NULL heap / byte sizes (not faked).
      - name: Check ClickHouse and Docker
        env:
          SMOKE_ENGINES: chromium chrome-headless-shell lightpanda
          SMOKE_NULLABLE_ENGINES: lightpanda
          SMOKE_EXPECTED_SESSIONS: "2"
        run: bash .github/scripts/assert-fleet-smoke.sh


      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p smoke-logs
          docker ps --all > smoke-logs/docker-ps.txt 2>&1 || true
          for id in $(docker ps --all --quiet --filter label=fleetscope.session); do
            docker logs "$id" > "smoke-logs/container-$id.log" 2>&1 || true
          done
      - name: Upload api and demo site logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-smoke-logs
          path: smoke-logs/
          retention-days: 7
          if-no-files-found: ignore

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the tip
      # Pinned to a commit SHA because this action receives GITHUB_TOKEN. Dependabot's
      # github-actions ecosystem keeps the pin updated.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if the repo moves to a GitHub organization (free personal repos need none).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
