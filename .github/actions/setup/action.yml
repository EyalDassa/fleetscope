name: Setup workspace
description: Install pnpm (version from package.json packageManager), Node 22 and dependencies with a cached pnpm store.

runs:
  using: composite
  steps:
    # pnpm must exist before setup-node, because setup-node's `cache: pnpm` calls it.
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
